<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Sous Chef</title>
    <style>
        :root {
            --primary: #d32f2f;
            --secondary: #ff6659;
            --bg-color: #f4f4f9;
            --text: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        nav button {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            margin-left: 1rem;
            cursor: pointer;
            opacity: 0.8;
            padding-bottom: 5px;
        }
        nav button.active {
            opacity: 1;
            border-bottom: 2px solid white;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto; /* Fixes the scrolling issue */
        }
        .controls {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-suggest {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-suggest:hover {
            background-color: #9a0007;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .card h3 { margin-top: 0; color: var(--primary); }
        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 10px;
            padding-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add { background-color: #4CAF50; color: white; }
        .btn-add:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-remove { background-color: #f44336; color: white; }
        .btn-view { background-color: #2196F3; color: white; }
	.btn-swap { background-color: #ff9800; color: white; }
        
        .shopping-list {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .shopping-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .shopping-item input { margin-right: 15px; transform: scale(1.2); }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
    </style>
</head>
<body>

    <header>
        <h2>Digital Sous Chef</h2>
        <nav>
            <button class="tab-btn active" onclick="switchTab('library')">Recipe Library</button>
            <button class="tab-btn" onclick="switchTab('plan')">My Weekly Plan</button>
            <button class="tab-btn" onclick="switchTab('shopping')">Shopping List</button>
        </nav>
    </header>

    <div class="main-content">
        <!-- RECIPE LIBRARY -->
        <div id="library" class="tab-section active">
            <div class="controls">
    <button class="btn-suggest" onclick="suggestSmartMeals()">🧠 Smart Suggest: 5 Meals (Low Waste)</button>
</div>
            <div class="grid" id="recipe-grid"></div>
        </div>

        <!-- WEEKLY PLAN -->
        <div id="plan" class="tab-section">
            <h2 style="text-align:center;">This Week's Menu</h2>
            <div class="grid" id="plan-grid"></div>
        </div>

        <!-- SHOPPING LIST -->
        <div id="shopping" class="tab-section">
            <div class="shopping-list">
                <h2>Master Shopping List</h2>
                <p>Check off items as you shop!</p>
                <div id="shopping-items"></div>
            </div>
        </div>
    </div>

    <!-- RECIPE DETAILS MODAL -->
    <div class="modal-overlay" id="recipe-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>

            <h3>Ingredients</h3>
            <ul id="modal-ingredients"></ul>
            <h3>Method</h3>
            <div id="modal-method"></div>
        </div>
    </div>

       let selectedPlan = [];
	let recentlySwapped = []; // NEW: Memory for rejected meals

        // UI NAVIGATION
        function switchTab(tabId) {
            // Hide all sections and remove active classes
            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                // Automatically highlight the correct tab button
                if (btn.getAttribute('onclick').includes(tabId)) {
                    btn.classList.add('active');
                }
            });
            
            // Show the target section
            document.getElementById(tabId).classList.add('active');
            
            if(tabId === 'shopping') generateShoppingList();
        }

        // RENDER LIBRARY
        function renderLibrary() {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = '';
            recipes.forEach(recipe => {
                const inPlan = selectedPlan.includes(recipe.id);
                grid.innerHTML += `
                    <div class="card">
                        <h3>${recipe.name}</h3>
                        <p>🕒 ${recipe.time} | 🥩 ${recipe.type}</p>
                        <div class="card-actions">
                            <button class="btn btn-view" onclick="openModal(${recipe.id})">View Details</button>
                            <button class="btn btn-add" onclick="togglePlan(${recipe.id})" ${inPlan ? 'disabled' : ''}>
                                ${inPlan ? 'Added ✓' : 'Add to Plan'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

	// RENDER PLAN (WITH QUICK ADD, CLEAR, AND AUTO-FILL)
        function renderPlan() {
            const grid = document.getElementById('plan-grid');
            grid.innerHTML = '';
            
            // STATE 1: If the plan is completely empty
            if(selectedPlan.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                        <h3 style="color: #333; margin-top: 0;">Your plan is empty!</h3>
                        <p style="font-size: 1.1rem; color: #666; margin-bottom: 2rem;">Add meals manually from the Library, or let me build a smart, low-waste menu for you.</p>
                        <button class="btn-suggest" onclick="suggestSmartMeals()">✨ Auto-Fill 5 Meals</button>
                    </div>
                `;
            } else {
                // STATE 2: If there are meals in the plan
                
                // Determine if we need to disable the "Fill" button (if they already have 5+ meals)
                const isFull = selectedPlan.length >= 5;
                
                // Add the control buttons to the top row
                grid.innerHTML += `
                    <div style="grid-column: 1 / -1; display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <button class="btn btn-add" style="max-width: 220px; padding: 10px;" onclick="suggestSmartMeals()" ${isFull ? 'disabled style="background-color: #ccc; cursor: not-allowed;"' : ''}>
                            ✨ Fill Remaining
                        </button>
                        <button class="btn btn-remove" style="max-width: 200px; padding: 10px;" onclick="clearPlan()">
                            🗑️ Clear Plan
                        </button>
                    </div>
                `;

                // Render the selected recipe cards
                selectedPlan.forEach(id => {
                    const recipe = recipes.find(r => r.id === id);
                    grid.innerHTML += `
                        <div class="card">
                            <h3>${recipe.name}</h3>
                            <div class="card-actions">
                                <button class="btn btn-view" onclick="openModal(${recipe.id})">Cook</button>
                                <button class="btn btn-swap" onclick="swapRecipe(${recipe.id})">Swap 🔄</button>
                                <button class="btn btn-remove" onclick="togglePlan(${recipe.id})">Remove</button>
                            </div>
                        </div>
                    `;
                });
            }

            // ALWAYS ADD: The "Quick Add" Dropdown Card
            let availableRecipes = recipes.filter(r => !selectedPlan.includes(r.id));
            if (availableRecipes.length > 0) {
                // Sort the dropdown alphabetically
                availableRecipes.sort((a, b) => a.name.localeCompare(b.name));
                let optionsHTML = availableRecipes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

                grid.innerHTML += `
                    <div class="card" style="border: 2px dashed #ccc; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: none;">
                        <h3 style="color: #666; font-size: 1.1rem; margin-top: 0;">➕ Add Another Meal</h3>
                        <select id="quick-add-select" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit;">
                            <option value="">-- Choose a recipe --</option>
                            ${optionsHTML}
                        </select>
                        <button class="btn btn-add" style="width: 100%;" onclick="quickAddFromPlan()">Add to Plan</button>
                    </div>
                `;
            }
        }

	// QUICK ADD FROM PLAN PAGE
        function quickAddFromPlan() {
            const select = document.getElementById('quick-add-select');
            const newId = parseInt(select.value);
            
            // If they clicked the button without selecting a meal, do nothing
            if (!newId) return; 

            selectedPlan.push(newId);
            renderLibrary();
            renderPlan();
            generateShoppingList();
        }

        // TOGGLE RECIPE IN PLAN
        function togglePlan(id) {
            if (selectedPlan.includes(id)) {
                selectedPlan = selectedPlan.filter(rId => rId !== id);
            } else {
                selectedPlan.push(id);
            }	
            renderLibrary();
            renderPlan();
            generateShoppingList();
        }

	// CLEAR ENTIRE PLAN
        function clearPlan() {
            selectedPlan = [];
            recentlySwapped = []; // Wipe the swap memory too
            renderLibrary();
            renderPlan();
            generateShoppingList();
        }

	// SMART SWAP A SINGLE RECIPE (WITH MEMORY)
        function swapRecipe(oldId) {
            // 1. Remove the unwanted recipe from the plan
            selectedPlan = selectedPlan.filter(rId => rId !== oldId);

            // 2. Add it to the "Recently Swapped" memory (keep the last 10)
            recentlySwapped.push(oldId);
            if (recentlySwapped.length > 10) recentlySwapped.shift();

            // 3. Build a "Pantry" out of the REMAINING meals in the plan
            let currentPantry = new Set();
            selectedPlan.forEach(id => {
                let recipe = recipes.find(r => r.id === id);
                recipe.ingredients.forEach(ing => currentPantry.add(getBaseIngredient(ing)));
            });

            // 4. Filter out meals already in the plan AND those we recently rejected
            let availableRecipes = recipes.filter(r => !selectedPlan.includes(r.id) && !recentlySwapped.includes(r.id));

            // Failsafe: If we somehow rejected everything, wipe the memory and start fresh
            if (availableRecipes.length === 0) {
                recentlySwapped = [oldId]; 
                availableRecipes = recipes.filter(r => !selectedPlan.includes(r.id) && r.id !== oldId);
            }

            // 5. Score the remaining recipes
            let bestScore = -1;
            let bestIndex = -1;

            availableRecipes.forEach((recipe, index) => {
                let score = 0;
                recipe.ingredients.forEach(ing => {
                    if (currentPantry.has(getBaseIngredient(ing))) {
                        score += 1;
                    }
                });
                
                // Add a bit of randomness to break ties
                score += (Math.random() * 0.5); 

                if (score > bestScore) {
                    bestScore = score;
                    bestIndex = index;
                }
            });

            // 6. Add the new winning recipe
            let nextMeal = availableRecipes[bestIndex];
            selectedPlan.push(nextMeal.id);

            // 7. Refresh the UI
            renderLibrary();
            renderPlan();
            generateShoppingList();
        }

        // HELPER: Strip measurements to find the core ingredient (e.g., "2 tbsp Gochujang" -> "gochujang")
        function getBaseIngredient(item) {
            let lower = item.toLowerCase();
            // FIXED: The forward slash has been properly escaped here (\/) so it doesn't crash the browser!
            return lower.replace(/^(\d+(\.\d+)?(-|\/)?\d*\s*(g|tbsp|tsp|ml|cloves|thumb|tin|handful|heads|packs|stalk|bunch)\s*|^\d+\s*)/, '').trim();
        }

	// SMART SUGGEST / FILL PLAN
        function suggestSmartMeals() {
            let availableRecipes = [...recipes]; 
            
            // 1. If your plan already has 5 meals, wipe it clean to generate a fresh batch
            if (selectedPlan.length >= 5) {
                selectedPlan = [];
                recentlySwapped = [];
            }
            
            // 2. If your plan is completely empty, pick a random seed meal first
            if (selectedPlan.length === 0) {
                let seedIndex = Math.floor(Math.random() * availableRecipes.length);
                let firstMeal = availableRecipes.splice(seedIndex, 1)[0];
                selectedPlan.push(firstMeal.id);
            }
            
            // 3. Start a "Pantry" out of whatever meals are CURRENTLY in your plan
            let currentPantry = new Set();
            selectedPlan.forEach(id => {
                let recipe = recipes.find(r => r.id === id);
                recipe.ingredients.forEach(ing => currentPantry.add(getBaseIngredient(ing)));
            });

            // 4. Filter out meals already in the plan or recently swapped
            availableRecipes = availableRecipes.filter(r => !selectedPlan.includes(r.id) && !recentlySwapped.includes(r.id));

            // Failsafe in case we run out of available recipes
            if (availableRecipes.length === 0) {
                recentlySwapped = []; 
                availableRecipes = recipes.filter(r => !selectedPlan.includes(r.id));
            }

            // 5. Fill the REST of the plan up to 5 meals based on pantry overlap
            while (selectedPlan.length < 5 && availableRecipes.length > 0) {
                let bestScore = -1;
                let bestIndex = -1;

                availableRecipes.forEach((recipe, index) => {
                    let score = 0;
                    recipe.ingredients.forEach(ing => {
                        if (currentPantry.has(getBaseIngredient(ing))) {
                            score += 1;
                        }
                    });
                    
                    score += (Math.random() * 0.5); // Tie-breaker

                    if (score > bestScore) {
                        bestScore = score;
                        bestIndex = index;
                    }
                });

                let nextMeal = availableRecipes.splice(bestIndex, 1)[0];
                selectedPlan.push(nextMeal.id);
                nextMeal.ingredients.forEach(ing => currentPantry.add(getBaseIngredient(ing)));
            }

            // 6. Refresh the UI
            renderLibrary();
            renderPlan();
            switchTab('plan'); 
        }

	// GENERATE SHOPPING LIST
        function generateShoppingList() {
            const listDiv = document.getElementById('shopping-items');
            listDiv.innerHTML = '';
            
            if(selectedPlan.length === 0) {
                listDiv.innerHTML = '<p>No meals selected.</p>';
                return;
            }

            let aggregated = {};

            selectedPlan.forEach(id => {
                const recipe = recipes.find(r => r.id === id);
                recipe.ingredients.forEach(ing => {
                    // Ignore placeholders
                    if (ing === "Ingredients from card") return;

                    // This regex isolates the number, the unit (g, tbsp, etc.), and the ingredient name
                    const match = ing.match(/^([\d\.\/]+)?\s*(g|ml|tbsp|tsp|clove|cloves|thumb|tin|tins|handful|heads|packs|stalk|bunch)?\s*(.*)/i);

                    if (match) {
                        let qtyStr = match[1];
                        let unit = match[2] ? match[2].toLowerCase() : "";
                        let name = match[3].trim();
                        
                        // Standardize plurals so things group correctly (clove + cloves = cloves)
                        if (unit === 'cloves') unit = 'clove';
                        if (unit === 'tins') unit = 'tin';

                        // Parse the number (handles fractions like "1/2" and decimals)
                        let qty = 0;
                        let hasQty = qtyStr !== undefined;
                        if (hasQty) {
                            if (qtyStr.includes('/')) {
                                let parts = qtyStr.split('/');
                                qty = parseFloat(parts[0]) / parseFloat(parts[1]);
                            } else {
                                qty = parseFloat(qtyStr);
                            }
                        }

                        // Create a unique key (e.g., "garlic_clove" or "chicken thighs_g")
                        let key = name.toLowerCase() + "_" + unit;

                        if (aggregated[key]) {
                            // If we already have it, add to the total
                            if (hasQty) aggregated[key].qty += qty;
                        } else {
                            // If it's new, add it to our aggregator
                            aggregated[key] = {
                                qty: hasQty ? qty : null,
                                unit: unit,
                                originalName: name
                            };
                        }
                    } else {
                        // Fallback if it doesn't match normal formatting (e.g., "Vegetable Oil")
                        aggregated[ing] = { qty: null, unit: '', originalName: ing };
                    }
                });
            });

            // Convert to an array and format it beautifully
            const finalItems = Object.values(aggregated).map(item => {
                if (item.qty === null) return item.originalName; // No number needed
                
                // Format the number to avoid crazy decimals
                let displayQty = Number.isInteger(item.qty) ? item.qty : parseFloat(item.qty.toFixed(2));
                
                // Add an 's' back to units if there's more than 1
                let displayUnit = item.unit;
                if (displayQty > 1) {
                    if (item.unit === 'clove') displayUnit = 'cloves';
                    if (item.unit === 'tin') displayUnit = 'tins';
                }

                // Assemble the string (closing the gap for g/ml, leaving spaces for tbsp/cloves)
                let prefix = `${displayQty}${displayUnit ? (['g','ml'].includes(displayUnit) ? displayUnit : ' ' + displayUnit) : ''} `;
                
                return `${prefix}${item.originalName}`.trim();
            }).sort();

            // Render to the screen
            finalItems.forEach(item => {
                // Create an ID-safe string so the checkboxes work perfectly
                let safeId = item.replace(/[^a-zA-Z0-9]/g, '-');
                listDiv.innerHTML += `
                    <div class="shopping-item">
                        <input type="checkbox" id="item-${safeId}">
                        <label for="item-${safeId}">${item}</label>
                    </div>
                `;
            });
        }

        // MODAL LOGIC
        function openModal(id) {
            const recipe = recipes.find(r => r.id === id);
            document.getElementById('modal-title').innerText = recipe.name;
            document.getElementById('modal-time').innerText = recipe.time;
            document.getElementById('modal-type').innerText = recipe.type;
            
            const ingList = document.getElementById('modal-ingredients');
            ingList.innerHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');
            
            const methodDiv = document.getElementById('modal-method');
            methodDiv.innerHTML = recipe.method.map(m => `<p>${m}</p>`).join('');
            
            document.getElementById('recipe-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('recipe-modal').style.display = 'none';
        }

        // Initialize App
        renderLibrary();
        renderPlan();

    </script>
